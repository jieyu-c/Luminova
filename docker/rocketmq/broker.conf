brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# NameServer 地址,容器内通过服务名访问
namesrvAddr = rmqnamesrv:9876

# Broker 对外暴露的地址。容器网络内其他服务(proxy)通过该主机名访问 broker。
# 若需要宿主机上的应用直连 broker(非 proxy 模式),请改为宿主机 IP。
brokerIP1 = rmqbroker

# 自动创建 Topic(开发环境方便,生产环境建议关闭)
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
