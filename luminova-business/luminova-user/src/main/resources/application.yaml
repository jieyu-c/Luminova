server:
  port: ${SERVER_PORT:8082}

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
  config:
    import:
      - classpath:luminova/nacos.yaml
      - classpath:luminova/cache.yaml
      - classpath:luminova/datasource-postgresql.yaml
      - classpath:luminova/dubbo.yaml
  application:
    name: luminova-user

dubbo:
  protocol:
    port: ${DUBBO_PORT:20882}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-body: false
  is-read-cookie: false

luminova:
  admin:
    bootstrap:
      enabled: ${LUMINOVA_ADMIN_BOOTSTRAP_ENABLED:false}
      phone: ${LUMINOVA_ADMIN_BOOTSTRAP_PHONE:}
      password: ${LUMINOVA_ADMIN_BOOTSTRAP_PASSWORD:}
