server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import:
      - classpath:luminova/nacos.yaml
  application:
    name: luminova-gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOriginPatterns:
                  - "http://localhost:*"
                  - "http://127.0.0.1:*"
                  - "https://*.luminova.com"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders: "*"
                maxAge: 3600
          routes:
            - id: luminova-auth
              uri: lb://luminova-auth
              predicates:
                - Path=/api/v1/auth/**
            - id: luminova-user
              uri: lb://luminova-user
              predicates:
                - Path=/api/v1/user/**
