server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import:
      - classpath:luminova/nacos.yaml
      - classpath:luminova/cache.yaml
      - classpath:luminova/datasource-postgresql.yaml
      - classpath:luminova/dubbo.yaml
  application:
    name: @application.name@

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  is-read-header: true
  is-read-body: false
  is-read-cookie: false

luminova:
  security:
    # 生产环境必须通过部署密钥覆盖；该开发默认值不能用于公网环境。
    hmac-secret: ${LUMINOVA_HMAC_SECRET:development-only-change-me}
